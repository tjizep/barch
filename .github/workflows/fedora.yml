name: Fedora CI

on:
  push:
    paths-ignore:
      - "**/coverage.svg"
      - "**/README.md"
      - "**/DOCKER.md"
  pull_request:
    paths-ignore:
      - "**/coverage.svg"
jobs:
  fedora-build:
    runs-on: ubuntu-24.04
    # The build runs in a fedora:latest container on the Ubuntu runner. It runs as
    # root there, unlike ci/local-ci.sh. snappairtest.py checks for root.
    container: fedora:latest
    steps:
      # The same packages as ci/Dockerfile.fedora. Keep the two lists the same.
      # git comes first: without it actions/checkout downloads a tarball with
      # no .git, and the tests that run git need one.
      - name: Install packages
        run: |
          dnf install -y --setopt=install_weak_deps=False \
              gcc gcc-c++ make cmake git swig \
              python3 python3-devel python3-pip \
              java-latest-openjdk-devel maven \
              openssl-devel pkgconf-pkg-config ca-certificates curl \
              diffutils findutils which perl procps-ng
      - uses: actions/checkout@v4
      - name: Use cmake
        run: |
          set -xe
          # the checkout belongs to another uid than the container's root
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Neither distribution ships a static OpenSSL, so BUILD_OPENSSL builds one.
          cmake -B build \
             -DTEST_OD=ON \
             -DADD_WASM=ON \
             -DBUILD_OPENSSL=ON \
             -DCMAKE_CXX_FLAGS=' -Wall -Wextra '
          # an explicit -j, see ubuntu24.yml
          cmake --build build --target barch --parallel "$(nproc)"
          cmake --build build --target lbarch --parallel "$(nproc)"
          cmake --build build --target globdifftest --parallel "$(nproc)"
          cmake --build build --target locktest --parallel "$(nproc)"
          cmake --build build --target barchd --parallel "$(nproc)"
          test -x build/barchd
          # serially, and only ci/focus_tests.txt when it lists any - see ubuntu24.yml
          FOCUS=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' "$GITHUB_WORKSPACE/ci/focus_tests.txt" 2>/dev/null | paste -sd'|')
          ( cd build ; ctest --output-on-failure ${FOCUS:+-R "^($FOCUS)\$"} )
      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_dist
          cp build/liblbarch.so release_dist/
          cp RUNVALKEY.md release_dist/README.md
          tar -czvf barch-valkey-module-fedora-x86_64.tar.gz -C release_dist liblbarch.so README.md
          mkdir -p release_py_dist
          cp build/_barch.so release_py_dist/
          cp build/barch.py release_py_dist/
          cp build/setup.py release_py_dist/
          cp RUNPY.md release_py_dist/README.md
          tar -czvf barch-py-fedora-x86_64.tar.gz -C release_py_dist _barch.so setup.py barch.py README.md
      - name: Publish barch-py-fedora-x86_64.tar.gz Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: barch-py-fedora-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish barch-valkey-module-fedora-x86_64.tar.gz Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: barch-valkey-module-fedora-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
