name: Ubuntu 22.04 CI (GCC 11)

on:
  push:
    paths-ignore:
      - "**/coverage.svg"
      - "**/README.md"
      - "**/DOCKER.md"
  pull_request:
    paths-ignore:
      - "**/coverage.svg"
jobs:
  ubuntu-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Use cmake
        run: |
          set -xe
          cmake -B build \
             -DTEST_OD=ON \
             -DCMAKE_CXX_FLAGS=' -Wall -Wextra '
      - name: build
        run: |
          # --parallel with no number becomes `gmake -j`, which to GNU make
          # means no limit: every ready source starts at once. That is 58
          # compiles of around a gigabyte each on a 16GB runner, and the job
          # dies with SIGTERM (exit 143) and no gcc error to explain it. The
          # coverage workflow hit the same wall. Ninja caps itself, so a
          # local build never shows this.
          cmake --build build --target barch --parallel "$(nproc)"
          cmake --build build --target lbarch --parallel "$(nproc)"
          cmake --build build --target globdifftest --parallel "$(nproc)"
          cmake --build build --target locktest --parallel "$(nproc)"
          # barchd too: about 90 tests start one, and without it they print
          # SKIP and pass in a tenth of a second - TODO 740
          cmake --build build --target barchd --parallel "$(nproc)"
          test -x build/barchd
          # Serially. Tests isolate themselves into <build>/t/<name> and take
          # their port from ctest, so parallel works (DONE 197-199), but the
          # runner has 4 vCPU and most tests start a barchd of their own, so
          # two at a time compete with each other. Serially the whole set
          # took about 17 minutes at 4 CPUs locally - TODO 740.
          # only the tests in ci/focus_tests.txt for now - TODO 803. An empty list runs them all
          FOCUS=$(sed -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' "$GITHUB_WORKSPACE/ci/focus_tests.txt" 2>/dev/null | paste -sd'|')
          ( cd build ; ctest --output-on-failure ${FOCUS:+-R "^($FOCUS)\$"} )
      - name: Prepare Release Artifacts
        run: |
          # Create a directory for the archive
          mkdir -p release_dist
          # Copy the library (adjust path if it's in a subdirectory of build)
          cp build/liblbarch.so release_dist/
          cp RUNVALKEY.md release_dist/README.md
          # Create the gzip archive
          tar -czvf barch-valkey-module-ubuntu22-x86_64.tar.gz -C release_dist liblbarch.so README.md
          mkdir -p release_py_dist
          cp build/_barch.so release_py_dist/
          cp build/barch.py release_py_dist/
          cp build/setup.py release_py_dist/
          cp RUNPY.md release_py_dist/README.md
          tar -czvf barch-py-ubuntu22-x86_64.tar.gz -C release_py_dist _barch.so setup.py barch.py README.md
      - name: Ubuntu 22.04 Python x86_64 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: barch-py-ubuntu22-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ubuntu 22.02 Valkey x86_64 Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: barch-valkey-module-ubuntu22-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}