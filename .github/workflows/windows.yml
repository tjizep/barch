name: Windows CI (MinGW-w64)

# barchd and the python module, built from win32/CMakeLists.txt - see
# win32/README.md, TODO 598 and TODO 599.
#
# UCRT64 rather than MINGW64: _barch.pyd is loaded by python.org's python, which
# is built against the UCRT, and barchd.exe goes along so both use one C runtime.
on:
  push:
    paths-ignore:
      - "**/coverage.svg"
      - "**/README.md"
      - "**/DOCKER.md"
  pull_request:
    paths-ignore:
      - "**/coverage.svg"
jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # python.org's python: the one the module is built for and tested in
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-swig
            mingw-w64-ucrt-x86_64-libmariadbclient
            mingw-w64-ucrt-x86_64-postgresql
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-zlib
      # mingw-w64 r532 (crt and friends, 14.0.0.r532.gdbbc8e99d) breaks the link:
      # libmingwex.a's fesetenv.c wants __mingw_fe_dfl_env and nothing defines it -
      # TODO 746. Put back the r495 set the last good build had. crt, headers and
      # winpthreads come from one source, so they go back together. Drop this step
      # once MSYS2 ships a crt newer than r532 and a build without it links again
      - name: Pin mingw-w64 to r495
        run: |
          set -e
          echo "the repo has: $(pacman -Q mingw-w64-ucrt-x86_64-crt)"
          base=https://repo.msys2.org/mingw/ucrt64
          pacman -U --noconfirm \
            "$base/mingw-w64-ucrt-x86_64-headers-14.0.0.r495.g63ebe6cdb-1-any.pkg.tar.zst" \
            "$base/mingw-w64-ucrt-x86_64-crt-14.0.0.r495.g63ebe6cdb-1-any.pkg.tar.zst" \
            "$base/mingw-w64-ucrt-x86_64-libwinpthread-14.0.0.r495.g63ebe6cdb-2-any.pkg.tar.zst" \
            "$base/mingw-w64-ucrt-x86_64-winpthreads-14.0.0.r495.g63ebe6cdb-2-any.pkg.tar.zst"
          pacman -Q mingw-w64-ucrt-x86_64-headers mingw-w64-ucrt-x86_64-crt \
                    mingw-w64-ucrt-x86_64-libwinpthread mingw-w64-ucrt-x86_64-winpthreads
      - name: Build barchd and the python module
        run: |
          set -xe
          cmake -S win32 -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DBARCH_PYTHON_ROOT="$(cygpath -m "$pythonLocation")"
          cmake --build build-win --target barchd barch --parallel "$(nproc)"
          ls -la build-win/barchd.exe build-win/_barch.pyd build-win/barch.py
          # one exe and one pyd, with nothing beside them: only system dlls (and
          # python's own, for the pyd) should show here
          objdump -p build-win/barchd.exe | grep "DLL Name"
          objdump -p build-win/_barch.pyd | grep "DLL Name"
      - name: Smoke test
        shell: pwsh
        run: python win32/smoke_test.py build-win/barchd.exe
      # how much Windows takes from an IOCP server before a client that reads
      # nothing stops its sends completing - TODO 599. Diagnostic, prints only
      - name: Send backpressure probe
        shell: pwsh
        run: python win32/send_probe.py
      - name: Python tests
        shell: pwsh
        run: |
          python -m pip install --quiet redis requests
          # only the tests in ci/focus_tests.txt for now - TODO 803. An empty list runs them all
          $focus = (Get-Content ci/focus_tests.txt -ErrorAction SilentlyContinue |
                    ForEach-Object { ($_ -replace '#.*', '').Trim() } | Where-Object { $_ }) -join '|'
          if ($focus) {
            python win32/run_tests.py --build build-win -j 4 -R "^($focus)$"
          } else {
            python win32/run_tests.py --build build-win -j 4
          }
      - name: Keep the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs
          # the runner's per test logs, and every barchd.log the tests leave in
          # their own directories
          path: build-win/testroot/**/*.log
          if-no-files-found: ignore
      - name: Keep barchd.exe when a test fails
        # a crash report gives frames as barchd.exe+<offset>; addr2line needs this
        # build's binary to say where they are - TODO 646
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: barchd-exe
          path: build-win/barchd.exe
          if-no-files-found: ignore
      - name: Prepare Release Artifacts
        run: |
          set -e
          # windows-amd64-<version>.zip - TODO 649. A tag build takes the version
          # from the tag (v0.5.8b gives 0.5.8b); any other build asks barchd
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(build-win/barchd.exe --version | cut -d' ' -f1)"
          fi
          win_zip="windows-amd64-${version}.zip"
          echo "WIN_ZIP=$win_zip" >> "$GITHUB_ENV"
          mkdir -p release_win release_py_win
          cp build-win/barchd.exe release_win/
          cp win32/README.md release_win/README.md
          (cd release_win && zip -9 "../$win_zip" barchd.exe README.md)
          cp build-win/_barch.pyd build-win/barch.py release_py_win/
          cp win32/README.md release_py_win/README.md
          (cd release_py_win && zip -9 ../barch-py-windows-x86_64.zip _barch.pyd barch.py README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: ${{ env.WIN_ZIP }}
      - uses: actions/upload-artifact@v4
        with:
          name: barch-py-windows-x86_64
          path: barch-py-windows-x86_64.zip
      - name: Publish the Windows release zips
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ env.WIN_ZIP }}
            barch-py-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
