# barch-cdc: how Postgres rows map to barch keys. See /opt/barch/CDC.md.

[barch]
host = 127.0.0.1
port = 14000
# First boot makes this user and its password. It may read, write and delete
# keys, and nothing else.
user = cdc
password_file = /etc/barch/cdc-password

[listen]
# Debezium Server posts here. Keep it on 127.0.0.1.
address = 127.0.0.1
port = 14080

[defaults]
# invalidate: DEL the row's key on every change. The application loads it again.
# upsert: SET the key to the new row as JSON, DEL it on delete.
mode = invalidate
# The key a row has in barch. {schema}, {table} and any column of the row can be
# used. Tables with no [table ...] section use this one. Leave it empty to skip
# tables that have no section.
key = {table}:{id}
# Seconds a SET key lives in upsert mode. 0 keeps it.
ttl = 0

# One section per table that differs from the defaults. The name is
# schema.table, or just table.
#
# [table public.orders]
# key = order:{order_id}
# mode = upsert
# ttl = 3600
