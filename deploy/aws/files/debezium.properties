# Debezium Server settings. See /opt/barch/CDC.md.
# Set the database.* lines and table.include.list. The password goes in
# /etc/barch/debezium.env, not here.

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.database.hostname=CHANGE-ME.rds.amazonaws.com
debezium.source.database.port=5432
debezium.source.database.user=barch_cdc
debezium.source.database.dbname=postgres
debezium.source.database.sslmode=require
# From DEBEZIUM_SOURCE_DATABASE_PASSWORD in /etc/barch/debezium.env
debezium.source.database.password=${DEBEZIUM_SOURCE_DATABASE_PASSWORD}
# Tables to follow, as schema.table, comma separated.
debezium.source.table.include.list=public.orders
debezium.source.topic.prefix=barch
debezium.source.slot.name=barch_cdc
debezium.source.publication.name=barch_cdc
debezium.source.publication.autocreate.mode=filtered
# A cache needs changes, not a copy of the tables.
debezium.source.snapshot.mode=no_data
# Send TRUNCATE too. Debezium skips it unless told.
debezium.source.skipped.operations=none
debezium.source.tombstones.on.delete=false
debezium.source.decimal.handling.mode=string
debezium.source.offset.storage.file.filename=/var/lib/barch-cdc/offsets.dat
debezium.source.offset.flush.interval.ms=1000

# The Redis sink. barchd's XADD comes from barchex STREAMS. It forwards each
# change to the queue "debezium", and CDCAPPLY applies it to the cache. First
# boot forwards the streams barch.*, so keep the prefix or change both.
debezium.sink.type=redis
debezium.sink.redis.address=127.0.0.1:14000
debezium.sink.redis.user=cdc
# From /etc/barch/cdc-password, through debezium-run.sh
debezium.sink.redis.password=${BARCH_CDC_PASSWORD}
debezium.sink.redis.message.format=compact
# The check reads Redis memory figures barchd may not give. 0 turns it off.
debezium.sink.redis.memory.threshold.percentage=0
debezium.sink.redis.memory.limit.mb=0
debezium.sink.redis.wait.enabled=false

# The HTTP sink to barch-cdc instead. Comment out the Redis lines above, take
# the # off these, and enable barch-cdc.service too.
#debezium.sink.type=http
#debezium.sink.http.url=http://127.0.0.1:14080/
#debezium.sink.http.timeout.ms=60000
#debezium.sink.http.retries=1000000
#debezium.sink.http.retry.interval.ms=2000

debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

quarkus.http.port=14081
quarkus.http.host=127.0.0.1
quarkus.log.console.json=false
