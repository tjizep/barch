<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barch Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="logo"><b>Barch<em>.</em></b><small>Market</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search the catalogue…" autocomplete="off">
      <button class="go" tabindex="-1">🔍</button>
    </div>
    <button class="head-btn" id="wish-btn">♥ Wishlist<span class="pill wish" id="wpill">0</span></button>
    <button class="head-btn" id="basket-btn">🧺 Basket<span class="pill" id="pill">0</span></button>
    <button class="head-btn" id="account-btn">👤 Sign in</button>
  </div>
</header>
<div class="subbar">
  <div class="bar">
    <a href="#" id="deals-link">🔥 Deals</a>
    <a href="#" id="all-link">📦 All products</a>
    <a href="#" id="wishlist-link">♥ Wishlist</a>
    <span class="fill"></span>
    <a href="#" id="basket-link" class="basket">🧺 <span id="pill2">0</span> items</a>
  </div>
</div>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="banner">
      <div>
        <div class="kicker">This week</div>
        <h2>Today's best picks, straight out of a key space</h2>
        <p><span id="banner-count">Every product</span>, categories read off a directory
           tree, and the pictures fetched the first time anyone looks at one.</p>
      </div>
      <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="head">
      <h1 id="title">All products</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="recent" id="recent"></div>
    <div class="toolbar">
      <div class="chips">
        <button class="chip" id="chip-sale" onclick="toggleSale()">🔥 On sale</button>
        <button class="chip on" data-r="0" onclick="setRating(0)">All ratings</button>
        <button class="chip" data-r="4" onclick="setRating(4)">4★ &amp; up</button>
        <button class="chip" data-r="3" onclick="setRating(3)">3★ &amp; up</button>
      </div>
      <select id="sort" onchange="apply()">
        <option value="rel">Sort: relevance</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="rating">Top rated</option>
        <option value="discount">Biggest discount</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more"></div>
  </section>
</main>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const PAGE = 24;
const PALETTE = ["#e0393e","#1a6fdc","#0a7d4f","#b4530a","#8e44ad","#16a085",
                  "#d35400","#2c3e50","#c0392b","#2980b9","#f39c12","#27ae60"];
let index = [], cats = [], view = [], shown = 0;
let cat = null, sub = null, catName = null, subName = null, term = "";
let mode = null;          // null | "deals" | "wishlist"
let onlySale = false, minRating = 0;
let basket = load("basket", {});
// where the checkout has got to, and what it has been told so far. The address
// and the payment choice outlive a reload; the step does not, because arriving
// back on a payment screen with no memory of why is worse than starting again
let checkoutStep = 0;
let delivery = load("delivery", {});
let payMethod = load("pay", null);
let pendingOrders = 0;
let wishlist = load("wishlist", {});
let recent = load("recent", []);

function load(k, dflt) { try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const money = (n, c) => (c === "INR" ? "₹" : c === "GBP" ? "£" : "$") +
  n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
// every image goes through /img, which fetches it once and keeps it
const shot = asin => "/img/" + encodeURIComponent(asin);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));
const discountOf = p => (p.was && p.was > p.price) ? Math.round((1 - p.price / p.was) * 100) : 0;

function iconFor(slug) {
  const icons = {
    "arts-crafts-sewing": "🎨", "automotive": "🚗", "baby-products": "🍼",
    "beauty-personal-care": "💄", "beauty": "💅", "cell-phones-accessories": "📱",
    "clothing-shoes-jewelry": "👗", "electronics": "🔌", "grocery-gourmet-food": "🛒",
    "health-household": "🏠", "hobbies": "🎯", "home-kitchen": "🍳",
    "industrial-scientific": "🔬", "movies-tv": "🎬", "musical-instruments": "🎸",
    "office-products": "🖇️", "other": "🏷️", "patio-lawn-garden": "🌿",
    "pet-supplies": "🐾", "remote-app-controlled-vehicle-parts": "🚁",
    "remote-app-controlled-vehicles-parts": "🚁", "sports-outdoors": "🏀",
    "tools-home-improvement": "🛠️", "toys-games": "🧸", "video-games": "🎮",
  };
  return icons[slug] || "🏷️";
}

function colorFor(slug) {
  let h = 0;
  for (let i = 0; i < (slug || "").length; i++) h = (h * 31 + slug.charCodeAt(i)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function toast(msg, kind) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add("out"), 1700);
  setTimeout(() => el.remove(), 2100);
}

let me = null; // {email, name} once signed in, else null

function drawAccount() {
  const btn = document.getElementById("account-btn");
  if (me) {
    // signed in, the button opens the account rather than signing you out. It
    // used to do the second, which meant there was nowhere to see an order from
    btn.innerHTML = `👤 ${esc(me.name || me.email)}` +
      (pendingOrders ? `<span class="pill">${pendingOrders}</span>` : "");
    btn.onclick = openAccount;
  } else {
    btn.textContent = "👤 Sign in";
    btn.onclick = () => location.href = "/shop/signon.html";
  }
}

async function signOut() {
  await fetch("/api/signout", { method: "POST" });
  me = null;
  pendingOrders = 0;
  drawAccount();
  shut();
  toast("Signed out");
}

// The account: who you are, and what you have ordered. The orders come off the
// session, so there is no version of this that reads somebody else's.
async function openAccount() {
  show(`<div class="top"><h2>Account</h2><button onclick="shut()">Close</button></div>
    <div class="account">
      <div class="who">
        <div><b>${esc(me.name || "—")}</b><small>${esc(me.email)}</small></div>
        <div class="row">
          <a class="head-btn" href="/shop/spaces.html">🗂 Key spaces</a>
          <button onclick="signOut()">Sign out</button>
        </div>
      </div>
      <h3>Orders</h3>
      <div id="orders"><div class="empty" style="padding:22px 0">Loading…</div></div>
    </div>`);
  const box = document.getElementById("orders");
  const out = await fetch("/api/orders").then(r => r.json()).catch(() => null);
  if (!out || out.error) {
    box.innerHTML = `<div class="empty" style="padding:22px 0">${esc((out && out.error) || "Could not load your orders.")}</div>`;
    return;
  }
  const list = Array.isArray(out.orders) ? out.orders : [];
  pendingOrders = out.pending || 0;
  drawAccount();
  if (!list.length) {
    box.innerHTML = `<div class="empty" style="padding:22px 0">
      Nothing ordered yet. Anything you buy shows up here.</div>`;
    return;
  }
  box.innerHTML = list.map(o => `
    <div class="order">
      <div class="order-head">
        <span class="oid">${esc(o.id)}</span>
        <span class="state ${esc(o.state || "")}">${esc(o.state || "unknown")}</span>
        <span class="when">${esc(placedOn(o.placed))}</span>
        <span class="amt">${money(o.total, o.currency)}</span>
      </div>
      <div class="order-body">
        ${(Array.isArray(o.items) ? o.items : []).map(i => `
          <div class="order-line">
            <span class="q">${i.qty}&times;</span>
            <span class="t">${esc(i.title)}</span>
            <span class="p">${money(i.price * i.qty, o.currency)}</span>
          </div>`).join("")}
        <div class="order-foot">
          <span>${esc(payName(o.payment && o.payment.method))}</span>
          <span>${esc(o.address || "")}</span>
        </div>
      </div>
    </div>`).join("");
}

// The order carries whatever the browser's clock said when it was placed. It is
// a string from somebody else's machine, so it is shown if it parses and left
// out if it does not, rather than printing "Invalid Date" at a customer.
function placedOn(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString(undefined,
    { year: "numeric", month: "short", day: "numeric" });
}

function payName(id) {
  const m = PAY_METHODS.find(x => x.id === id);
  return m ? m.name : (id || "");
}

async function boot() {
  const [idx, c, who] = await Promise.all([
    fetch("/api/index").then(r => r.json()),
    fetch("/api/categories").then(r => r.json()),
    fetch("/api/me").then(r => r.json()).catch(() => ({ user: null })),
  ]);
  index = idx;
  cats = c;
  me = who.user || null;
  drawAccount();
  refreshPending();
  // the count is the one the catalog actually has, in both places it is said
  const n = index.length.toLocaleString();
  document.getElementById("q").placeholder = `Search ${n} products…`;
  document.getElementById("banner-count").textContent = `${n} products`;
  drawNav();
  apply();
  wishCount();
  count();
}

// One extra request on load when signed in, so the account button can say how
// many orders are outstanding without anybody opening it.
async function refreshPending() {
  if (!me) return;
  const out = await fetch("/api/orders?limit=100").then(r => r.json()).catch(() => null);
  if (!out || out.error) return;
  pendingOrders = out.pending || 0;
  drawAccount();
}

function goto(next) {
  next();
  apply();
  drawNav();
}

function drawNav() {
  const nav = document.getElementById("nav");
  // The whole sidebar is rebuilt on every navigation, so the scrolling box is a
  // new element each time and starts at the top. Remember where the old one was
  // or picking a sub-category throws the reader back to the top of the alphabet,
  // which is a long way from Toys & Games.
  const wasAt = (nav.querySelector(".nav-cats") || {}).scrollTop || 0;
  nav.innerHTML = "<h3>Browse</h3>";

  const deals = document.createElement("a");
  deals.className = "special" + (mode === "deals" ? " on" : "");
  deals.href = "#";
  deals.innerHTML = "🔥 Today's deals";
  deals.onclick = e => { e.preventDefault(); goto(() => { mode = "deals"; cat = sub = catName = subName = null; }); };
  nav.appendChild(deals);

  const wish = document.createElement("a");
  wish.className = "special" + (mode === "wishlist" ? " on" : "");
  wish.href = "#";
  wish.innerHTML = "♥ My wishlist";
  wish.onclick = e => { e.preventDefault(); goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; }); };
  nav.appendChild(wish);

  nav.appendChild(document.createElement("hr"));

  const all = document.createElement("a");
  all.textContent = "All products";
  all.href = "#";
  all.className = (!mode && !cat) ? "on" : "";
  all.onclick = e => { e.preventDefault(); goto(() => { mode = cat = sub = catName = subName = null; }); };
  nav.appendChild(all);

  const wrap = document.createElement("div");
  wrap.className = "nav-cats-wrap";
  const catsBox = document.createElement("div");
  catsBox.className = "nav-cats";
  const fadeTop = document.createElement("div");
  fadeTop.className = "nav-fade nav-fade-top";
  const fadeBot = document.createElement("div");
  fadeBot.className = "nav-fade nav-fade-bottom";
  wrap.appendChild(catsBox);
  wrap.appendChild(fadeTop);
  wrap.appendChild(fadeBot);
  nav.appendChild(wrap);

  for (const c of cats) {
    const a = document.createElement("a");
    a.href = "#";
    a.className = (!mode && cat === c.slug && !sub) ? "on" : "";
    a.innerHTML = `<span class="icon">${iconFor(c.slug)}</span>${esc(c.name)}`;
    // subName goes with sub. Leaving it set titled the page with the sub-category
    // you came from while the grid showed the new one, because the heading reads
    // the name and the filter reads the slug
    a.onclick = e => { e.preventDefault(); goto(() => { mode = null; cat = c.slug; catName = c.name; sub = subName = null; }); };
    catsBox.appendChild(a);
    if (!mode && cat === c.slug) {
      for (const s of c.subs) {
        const b = document.createElement("a");
        b.href = "#";
        b.className = "sub" + (sub === s.slug ? " on" : "");
        b.textContent = s.name;
        b.onclick = e => { e.preventDefault(); goto(() => { sub = s.slug; subName = s.name; }); };
        catsBox.appendChild(b);
      }
    }
  }

  const updateFade = () => {
    fadeTop.style.opacity = catsBox.scrollTop > 4 ? "1" : "0";
    const atBottom = catsBox.scrollTop + catsBox.clientHeight >= catsBox.scrollHeight - 4;
    fadeBot.style.opacity = atBottom ? "0" : "1";
  };
  catsBox.addEventListener("scroll", updateFade);

  // Put the box back where it was, then make sure what is now selected is
  // actually in it. Restoring the offset alone is not enough: clicking a top
  // level category expands its sub-categories, and the one at the bottom of the
  // visible strip pushes its own children out of sight.
  if (catsBox.scrollHeight > catsBox.clientHeight) {
    catsBox.scrollTop = wasAt;
    const on = catsBox.querySelector("a.on");
    if (on) {
      const top = on.offsetTop, bottom = top + on.offsetHeight;
      if (top < catsBox.scrollTop) catsBox.scrollTop = top - 8;
      else if (bottom > catsBox.scrollTop + catsBox.clientHeight)
        catsBox.scrollTop = bottom - catsBox.clientHeight + 8;
    }
  }
  updateFade();
}

function toggleSale() {
  onlySale = !onlySale;
  document.getElementById("chip-sale").classList.toggle("on", onlySale);
  apply();
}

function setRating(r) {
  minRating = r;
  document.querySelectorAll("[data-r]").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
  apply();
}

function sortView() {
  const by = document.getElementById("sort").value;
  const sorters = {
    price_asc: (a, b) => a.price - b.price,
    price_desc: (a, b) => b.price - a.price,
    rating: (a, b) => b.rating - a.rating,
    discount: (a, b) => discountOf(b) - discountOf(a),
  };
  if (sorters[by]) view.sort(sorters[by]);
}

function apply() {
  const t = term.trim().toLowerCase();
  let base = index;
  if (mode === "wishlist") base = index.filter(p => wishlist[p.asin]);
  else if (mode === "deals") base = index.filter(p => discountOf(p) > 0);

  view = base.filter(p => {
    if (!mode) {
      if (cat && p.top !== cat) return false;
      if (sub && p.sub !== sub) return false;
    }
    if (onlySale && discountOf(p) <= 0) return false;
    if (minRating && p.rating < minRating) return false;
    if (t && !(p.title.toLowerCase().includes(t) || (p.brand || "").toLowerCase().includes(t))) return false;
    return true;
  });
  sortView();

  // through `sub` rather than falling back off `subName`, so a handler that forgets
  // to clear one of the pair cannot put a stale name back in the heading
  document.getElementById("title").textContent =
    mode === "wishlist" ? "My wishlist" : mode === "deals" ? "Today's deals"
      : (sub && subName) || catName || "All products";
  document.getElementById("count").textContent =
    view.length + (view.length === 1 ? " product" : " products");
  document.getElementById("grid").innerHTML = "";
  shown = 0;
  page();
  renderRecent();
}

function renderRecent() {
  const box = document.getElementById("recent");
  const show = !mode && !cat && !term && recent.length;
  if (!show) { box.innerHTML = ""; return; }
  const items = recent.map(a => index.find(p => p.asin === a)).filter(Boolean).slice(0, 8);
  if (!items.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div style="width:100%;font-size:12px;color:var(--muted);margin-bottom:-8px">Recently viewed</div>` +
    items.map(p => `
      <div class="r-card" onclick="openProduct('${p.asin}')">
        <div class="shot"><img loading="lazy" alt="" src="${shot(p.asin)}"></div>
        <div class="t">${esc(p.title)}</div>
      </div>`).join("");
}

function page() {
  const grid = document.getElementById("grid");
  for (const p of view.slice(shown, shown + PAGE)) {
    const off = discountOf(p);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="shot">
        ${off ? `<div class="ribbon">-${off}%</div>` : ""}
        <button class="heart${wishlist[p.asin] ? " on" : ""}" data-asin="${p.asin}"
                onclick="toggleWish(this,'${p.asin}',event)" title="Wishlist">♥</button>
        <img loading="lazy" alt="" src="${shot(p.asin)}">
      </div>
      <div class="body">
        <div class="brand">${esc(p.brand) || "&nbsp;"}</div>
        <div class="name">${esc(p.title)}</div>
        <div class="stars">${stars(p.rating)} <small>${p.reviews.toLocaleString()}</small></div>
        <div class="price">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}${off ? `<span class="off">-${off}%</span>` : ""}</div>
        <button class="add-btn" onclick="quickAdd('${p.asin}',event)">🛒 Add</button>
      </div>`;
    card.onclick = () => openProduct(p.asin);
    grid.appendChild(card);
  }
  shown = Math.min(shown + PAGE, view.length);
  const more = document.getElementById("more");
  more.innerHTML = "";
  if (!view.length) {
    more.innerHTML = `<div class="empty">${mode === "wishlist" ? "Your wishlist is empty." : "Nothing matches that."}</div>`;
  } else if (shown < view.length) {
    const b = document.createElement("button");
    b.textContent = `Show more (${view.length - shown} left)`;
    b.onclick = page;
    more.appendChild(b);
  }
}

function quickAdd(asin, ev) {
  ev.stopPropagation();
  const row = index.find(p => p.asin === asin);
  if (!row) return;
  addToBasket({ asin: row.asin, title: row.title, price: row.price, currency: row.currency });
  toast("Added to basket", "success");
}

function toggleWish(btn, asin, ev) {
  ev.stopPropagation();
  if (wishlist[asin]) {
    delete wishlist[asin];
    toast("Removed from wishlist");
  } else {
    wishlist[asin] = true;
    toast("Added to wishlist ♥", "wish");
  }
  save("wishlist", wishlist);
  btn.classList.toggle("on", !!wishlist[asin]);
  wishCount();
  if (mode === "wishlist" && !wishlist[asin]) {
    const card = btn.closest(".card");
    if (card) card.remove();
    view = view.filter(p => p.asin !== asin);
    document.getElementById("count").textContent = view.length + (view.length === 1 ? " product" : " products");
    if (!view.length) document.getElementById("more").innerHTML = '<div class="empty">Your wishlist is empty.</div>';
  }
}

function wishCount() {
  document.getElementById("wpill").textContent = Object.keys(wishlist).length;
}

function recordRecent(asin) {
  recent = recent.filter(a => a !== asin);
  recent.unshift(asin);
  recent = recent.slice(0, 10);
  save("recent", recent);
}

async function openProduct(asin) {
  const p = await fetch("/api/product/" + encodeURIComponent(asin)).then(r => r.json());
  if (p.error) return;
  recordRecent(p.asin);
  const row = index.find(x => x.asin === p.asin) || {};
  const off = discountOf({ price: p.price, was: p.was });
  const wished = !!wishlist[p.asin];
  const rel = index.filter(x => x.asin !== p.asin && row.sub && x.sub === row.sub).slice(0, 6)
    .concat(index.filter(x => x.asin !== p.asin && row.top && x.top === row.top && x.sub !== row.sub))
    .slice(0, 6);

  show(`
    <div class="top"><h2>Product</h2><button onclick="shut()">Close</button></div>
    <div class="detail">
      <div class="shot">${off ? `<div class="ribbon">-${off}%</div>` : ""}
        <img alt="" src="${shot(p.asin)}"></div>
      <div>
        <div class="crumbs">${p.categories.map(esc).join(" &rsaquo; ")}</div>
        <h2>${esc(p.title)}</h2>
        <div class="brand"><span class="dot" style="background:${colorFor(row.top || "")}"></span>${esc(p.brand)}</div>
        ${p.seller ? `<div class="seller">Sold by ${esc(p.seller)}</div>` : ""}
        <div class="stars" style="margin-top:6px">${stars(p.rating)} <small>${p.reviews.toLocaleString()} reviews</small></div>
        <div class="price" style="margin:10px 0">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}${off ? `<span class="off">-${off}%</span>` : ""}</div>
        <div class="row">
          <button class="primary" onclick='addToBasketJson(${JSON.stringify(JSON.stringify({
            asin: p.asin, title: p.title, price: p.price, currency: p.currency }))}); toast("Added to basket","success")'>Add to basket</button>
          <button class="wish-toggle${wished ? " on" : ""}" onclick="toggleWishDetail(this,'${p.asin}')">♥ ${wished ? "Wishlisted" : "Wishlist"}</button>
          ${p.availability ? `<span class="badge ${/out of stock/i.test(p.availability) ? "warn" : "good"}">${esc(p.availability)}</span>` : ""}
        </div>
        <div class="desc">${esc(p.description) || "No description."}</div>
      </div>
    </div>
    ${rel.length ? `
    <div class="related">
      <h3>You might also like</h3>
      <div class="rgrid">
        ${rel.map(r => `
          <div class="rcard" onclick="openProduct('${r.asin}')">
            <div class="shot"><img loading="lazy" alt="" src="${shot(r.asin)}"></div>
            <div class="t">${esc(r.title)}</div>
            <div class="p">${money(r.price, r.currency)}</div>
          </div>`).join("")}
      </div>
    </div>` : ""}
    <div class="reviews" id="reviews" data-asin="${p.asin}"><h3>Ratings & reviews</h3></div>`);
  loadRatings(p.asin);
}

// The user-submitted rating, kept apart from p.rating/p.reviews - those two
// come from the imported catalog and never change; this is what shoppers
// using this storefront have actually said, stored in shopapi.luau's own
// rating:<asin>:<email> keys.
let myStars = 0;

function ratingStars(pick, current) {
  let out = "";
  for (let i = 1; i <= 5; i++) {
    out += `<span class="${i <= current ? "on" : ""}" onclick="${pick ? `pickStars(${i})` : ""}">★</span>`;
  }
  return out;
}

function pickStars(n) {
  myStars = n;
  const box = document.getElementById("reviews");
  if (box) box.querySelectorAll(".stars-in span").forEach((el, i) => el.classList.toggle("on", i < n));
}

async function loadRatings(asin) {
  const box = document.getElementById("reviews");
  if (!box || box.dataset.asin !== asin) return;
  const r = await fetch("/api/ratings/" + encodeURIComponent(asin)).then(x => x.json());
  if (r.error) return;
  myStars = r.mine ? r.mine.stars : 0;
  box.innerHTML = `
    <h3>Ratings & reviews</h3>
    <div class="reviews-sum">
      <span class="avg">${r.count ? r.average.toFixed(1) : "—"}</span>
      <span class="stars">${stars(r.average)}</span>
      <span class="count">${r.count ? r.count.toLocaleString() + (r.count === 1 ? " rating" : " ratings") : "No ratings yet"}</span>
    </div>
    <div class="rate-form">
      ${me ? `
        <div>${r.mine ? "Update your rating" : "Rate this product"}</div>
        <div class="stars-in">${ratingStars(true, myStars)}</div>
        <textarea id="review-text" placeholder="Add a review (optional)">${esc(r.mine ? r.mine.comment : "")}</textarea>
        <button class="primary" onclick="submitRating('${asin}')">Submit</button>
      ` : `<div class="signin-hint"><a href="/shop/signon.html">Sign in</a> to rate this product</div>`}
    </div>
    ${(Array.isArray(r.reviews) ? r.reviews : []).map(rv => `
      <div class="review">
        <div class="who">${esc(rv.name)}</div>
        <div class="stars">${stars(rv.stars)}</div>
        ${rv.comment ? `<div class="comment">${esc(rv.comment)}</div>` : ""}
      </div>`).join("")}`;
}

async function submitRating(asin) {
  if (myStars < 1) return toast("Pick a star rating first");
  const comment = document.getElementById("review-text").value;
  const r = await fetch("/api/ratings", {
    method: "POST",
    body: JSON.stringify({ asin, stars: myStars, comment }),
  }).then(x => x.json());
  if (r.error) return toast(r.error);
  toast("Thanks for rating this product", "success");
  loadRatings(asin);
}

function toggleWishDetail(btn, asin) {
  if (wishlist[asin]) {
    delete wishlist[asin];
    toast("Removed from wishlist");
  } else {
    wishlist[asin] = true;
    toast("Added to wishlist ♥", "wish");
  }
  save("wishlist", wishlist);
  const on = !!wishlist[asin];
  btn.classList.toggle("on", on);
  btn.innerHTML = "♥ " + (on ? "Wishlisted" : "Wishlist");
  wishCount();
  document.querySelectorAll(`.heart[data-asin="${asin}"]`).forEach(b => b.classList.toggle("on", on));
}

function addToBasketJson(json) { addToBasket(JSON.parse(json)); }

function addToBasket(p) {
  const have = basket[p.asin];
  basket[p.asin] = { ...p, qty: (have ? have.qty : 0) + 1 };
  save("basket", basket);
  count();
}

function count() {
  const n = Object.values(basket).reduce((a, b) => a + b.qty, 0);
  document.getElementById("pill").textContent = n;
  document.getElementById("pill2").textContent = n;
}

function total() {
  return Object.values(basket).reduce((a, b) => a + b.price * b.qty, 0);
}

function bump(asin, by) {
  const line = basket[asin];
  if (!line) return;
  line.qty += by;
  if (line.qty < 1) delete basket[asin];
  save("basket", basket);
  count();
  openBasket();
}

function openBasket() {
  checkoutStep = 0;
  drawCheckout();
}

// --- the ordering flow: basket, then delivery, then payment ----------------
//
// Three steps in the one panel rather than three pages, because the basket has
// to stay visible - somebody correcting an address should not have to wonder
// what they are buying. The step is state, not a route: nothing here is worth a
// URL, and a half-filled address surviving a reload is what `delivery` in
// localStorage is for.

function stepper(at) {
  const names = ["Basket", "Delivery", "Payment"];
  return `<div class="steps">${names.map((n, i) => `
    <span class="step ${i === at ? "on" : i < at ? "done" : ""}"
          ${i < at ? `onclick="gotoStep(${i})"` : ""}>
      <b>${i + 1}</b>${n}</span>`).join("")}</div>`;
}

function gotoStep(n) { checkoutStep = n; drawCheckout(); }

function basketLines() {
  return Object.values(basket).map(l => `
    <div class="line">
      <img alt="" src="${shot(l.asin)}">
      <div class="t">${esc(l.title)}</div>
      <div class="qty">
        <button onclick="bump('${l.asin}',-1)">−</button>${l.qty}
        <button onclick="bump('${l.asin}',1)">+</button>
      </div>
      <div>${money(l.price * l.qty, l.currency)}</div>
    </div>`).join("");
}

function drawCheckout() {
  const lines = Object.values(basket);
  if (!lines.length) {
    return show(`<div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
      <div class="empty" style="padding:44px 20px">Your basket is empty.</div>`);
  }
  if (checkoutStep === 1) return drawDelivery();
  if (checkoutStep === 2) return drawPayment();
  show(`
    <div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
    ${stepper(0)}
    <div class="lines">
      ${basketLines()}
      <div class="total"><span>Total</span><span>${money(total(), "USD")}</span></div>
    </div>
    <div class="step-foot">
      <button onclick="shut()">Keep shopping</button>
      <button class="primary" onclick="gotoStep(1)">Continue to delivery</button>
    </div>`);
}

// Step two. Street and suburb come out of the `geo` key space as you type; the
// house number and the postal code are typed, because Overture has no South
// African address data and a picker that pretended otherwise would be a lie.
function drawDelivery() {
  const d = delivery;
  show(`
    <div class="top"><h2>Delivery address</h2><button onclick="shut()">Close</button></div>
    ${stepper(1)}
    <form class="checkout" onsubmit="return toPayment(event)">
      <div class="two">
        <label>Full name<input name="name" required value="${esc(d.name || (me && me.name) || "")}"></label>
        <label>Phone<input name="phone" required value="${esc(d.phone || "")}" placeholder="082 000 0000"></label>
      </div>
      <label>Email<input name="email" type="email" required
             value="${esc(d.email || (me && me.email) || "")}"></label>
      <div class="two narrow-first">
        <label>Apt / unit <span class="opt">optional</span>
          <input name="unit" value="${esc(d.unit || "")}" placeholder="4B"></label>
        <label>Street address${lookupField("street", d.line || "")}</label>
      </div>
      <div class="two">
        <label>Suburb or city${lookupField("sub", d.suburb || "")}</label>
        <label>Postal code<input name="postcode" required value="${esc(d.postcode || "")}"
               placeholder="8001" inputmode="numeric"></label>
      </div>
      <label>Province
        <select name="province" id="province"><option value="">Choose…</option></select>
      </label>
      <label>Delivery note <span class="opt">optional</span>
        <textarea name="note" rows="2" placeholder="Gate code, which buzzer, where to leave it">${esc(d.note || "")}</textarea></label>
      <div class="step-foot">
        <button type="button" onclick="gotoStep(0)">Back to basket</button>
        <button class="primary" type="submit">Continue to payment</button>
      </div>
    </form>`);
  fillProvinces(d.province);
  wireLookup("street");
  wireLookup("sub");
}

function lookupField(kind, value) {
  const ph = kind === "street" ? "12 Long Street" : "Start typing a suburb…";
  return `<span class="lookup">
    <input name="${kind}" id="in-${kind}" autocomplete="off" required
           value="${esc(value)}" placeholder="${ph}">
    <div class="hits" id="hits-${kind}"></div>
  </span>`;
}

// A street line is written the way people write it - "12 Long Street" - and
// there is no street called "12 Long". So a leading run of digits is split off
// and only what follows is searched. Until the space is typed there is nothing
// to look for yet, which is a better answer than looking for the number.
const HOUSE_FIRST = /^(\d[\w\-\/]*)\s+(.*)$/;

function streetParts(value) {
  const line = (value || "").trim();
  const m = line.match(HOUSE_FIRST);
  if (m) return { house: m[1], name: m[2].trim() };
  // a bare number, still being typed: no name yet
  if (/^\d/.test(line)) return { house: line, name: "" };
  return { house: "", name: line };
}

// One debounced request per field. The endpoint is a range walk over the geo
// space, so this is cheap enough to run on a keystroke - but not so cheap that
// it should run on every one of them.
function wireLookup(kind) {
  const input = document.getElementById("in-" + kind);
  const box = document.getElementById("hits-" + kind);
  let timer = null, last = "";
  const close = () => { box.classList.remove("on"); box.innerHTML = ""; };
  input.addEventListener("blur", () => setTimeout(close, 150));
  input.addEventListener("input", () => {
    const q = kind === "street" ? streetParts(input.value).name : input.value.trim();
    clearTimeout(timer);
    if (q.length < 2) return close();
    timer = setTimeout(async () => {
      if (q === last) return;
      last = q;
      const url = `/api/places?kind=${kind}&q=${encodeURIComponent(q)}&limit=8`;
      const out = await fetch(url).then(r => r.json()).catch(() => null);
      if (!out || !out.hits || !out.hits.length) {
        box.innerHTML = `<div class="miss">Nothing found — type it in full, it is used as given.</div>`;
        box.classList.add("on");
        return;
      }
      box.innerHTML = out.hits.map(h => `
        <button type="button" onclick="pickPlace('${kind}', this)" data-v="${esc(h.name)}">
          <span>${esc(h.name)}</span>
          <small>${esc(h.metro ? h.metro.replace(/-/g, " ") : (h.kind || ""))}</small>
        </button>`).join("");
      box.classList.add("on");
    }, 160);
  });
}

function pickPlace(kind, el) {
  const input = document.getElementById("in-" + kind);
  if (kind === "street") {
    const house = streetParts(input.value).house;
    input.value = house ? house + " " + el.dataset.v : el.dataset.v;
  } else {
    input.value = el.dataset.v;
  }
  const box = document.getElementById("hits-" + kind);
  box.classList.remove("on");
  box.innerHTML = "";
}

async function fillProvinces(chosen) {
  const sel = document.getElementById("province");
  if (!sel) return;
  const out = await fetch("/api/places?kind=prov").then(r => r.json()).catch(() => null);
  const list = (out && out.hits) || [];
  if (!list.length) {
    // no geo data loaded: say so rather than leaving an empty dropdown
    sel.outerHTML = `<input name="province" id="province" required value="${esc(chosen || "")}"
                            placeholder="Province">`;
    return;
  }
  sel.innerHTML = `<option value="">Choose…</option>` +
    list.map(p => `<option${p === chosen ? " selected" : ""}>${esc(p)}</option>`).join("");
}

function toPayment(ev) {
  ev.preventDefault();
  const f = ev.target;
  // the line is kept as typed, and split as well: anything reading orders as text
  // wants the line, anything counting streets wants the parts
  const parts = streetParts(f.street.value);
  delivery = {
    name: f.name.value.trim(), phone: f.phone.value.trim(), email: f.email.value.trim(),
    unit: f.unit.value.trim(), line: f.street.value.trim(),
    house: parts.house, street: parts.name,
    suburb: f.sub.value.trim(), postcode: f.postcode.value.trim(),
    province: f.province.value.trim(), note: f.note.value.trim(),
  };
  save("delivery", delivery);
  gotoStep(2);
  return false;
}

// Step three. These are the ways this shop would take money, not a card form:
// nothing here asks for a card number, because an example storefront has no
// business collecting one and a demo that does teaches the wrong thing.
const PAY_METHODS = [
  { id: "cod", name: "Cash on delivery", note: "Pay the driver when it arrives." },
  { id: "card-on-delivery", name: "Card on delivery", note: "The driver brings a card machine." },
  { id: "eft", name: "EFT / bank transfer", note: "We send banking details and a reference with the order." },
];

function drawPayment() {
  const d = delivery;
  show(`
    <div class="top"><h2>Payment</h2><button onclick="shut()">Close</button></div>
    ${stepper(2)}
    <div class="pay">
      <div class="ship-card">
        <div class="ship-head">Delivering to <button type="button" onclick="gotoStep(1)">Change</button></div>
        <div class="ship-body">
          ${esc(d.name)} · ${esc(d.phone)}<br>
          ${d.unit ? "Unit " + esc(d.unit) + ", " : ""}${esc(d.line || "")}<br>
          ${esc(d.suburb)}${d.province ? ", " + esc(d.province) : ""} ${esc(d.postcode)}
          ${d.note ? `<div class="note">${esc(d.note)}</div>` : ""}
        </div>
      </div>
      <div class="methods">
        ${PAY_METHODS.map((m, i) => `
          <label class="method">
            <input type="radio" name="pay" value="${m.id}"${(payMethod || PAY_METHODS[0].id) === m.id ? " checked" : ""}>
            <span><b>${m.name}</b><small>${m.note}</small></span>
          </label>`).join("")}
      </div>
      <div class="total"><span>Total</span><span>${money(total(), "USD")}</span></div>
      <div class="step-foot">
        <button type="button" onclick="gotoStep(1)">Back to delivery</button>
        <button class="primary" onclick="placeOrder(this)">Place order</button>
      </div>
      <div class="note">Nothing is charged and no card details are asked for or stored.
        The order is written to a key in this space.</div>
    </div>`);
}

async function placeOrder(btn) {
  btn.disabled = true;
  payMethod = (document.querySelector('input[name=pay]:checked') || {}).value
              || PAY_METHODS[0].id;
  save("pay", payMethod);
  const d = delivery;
  const body = {
    name: d.name, email: d.email, phone: d.phone,
    // one line for anything that reads orders as text, and the parts beside it
    // for anything that does not want to parse that back apart
    address: [d.unit ? "Unit " + d.unit : "", d.line, d.suburb,
              [d.province, d.postcode].filter(Boolean).join(" ")].filter(Boolean).join(", "),
    delivery: d,
    payment: { method: payMethod },
    placed: new Date().toISOString(),
    items: Object.values(basket).map(l => ({ asin: l.asin, qty: l.qty })),
  };
  const out = await fetch("/api/order", { method: "POST", body: JSON.stringify(body) })
    .then(r => r.json()).catch(e => ({ error: String(e) }));
  if (out.error) {
    btn.disabled = false;
    toast("Could not place the order: " + out.error, "error");
    return;
  }
  basket = {};
  save("basket", basket);
  count();
  const method = (PAY_METHODS.find(m => m.id === payMethod) || {}).name || payMethod;
  show(`<div class="top"><h2>Order placed</h2><button onclick="shut()">Close</button></div>
    <div class="done">
      <div class="tick">✓</div>
      <p>Thank you. Your order is <strong>${esc(out.order.id)}</strong>,
         ${money(out.order.total, out.order.currency)} for
         ${out.order.items.length} item${out.order.items.length === 1 ? "" : "s"}.</p>
      <p>${esc(method)} — going to ${esc(out.order.address || "")}</p>
      <p class="note">Stored as <code>order:${esc(out.order.id)}</code>. Priced on the
         server from the catalog, not from the basket.</p>
    </div>`);
  toast("Order placed", "success");
  if (me) { pendingOrders += 1; drawAccount(); }
}

function show(html) {
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function shut() { document.getElementById("veil").classList.remove("on"); }

document.getElementById("q").addEventListener("input", e => { term = e.target.value; apply(); });
document.getElementById("basket-btn").onclick = openBasket;
document.getElementById("basket-link").onclick = e => { e.preventDefault(); openBasket(); };
document.getElementById("wish-btn").onclick = () => goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; });
document.getElementById("wishlist-link").onclick = e => { e.preventDefault(); goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; }); };
document.getElementById("deals-link").onclick = e => { e.preventDefault(); goto(() => { mode = "deals"; cat = sub = catName = subName = null; }); };
document.getElementById("all-link").onclick = e => { e.preventDefault(); goto(() => { mode = cat = sub = catName = subName = null; }); };
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") shut(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
boot();
</script>
</body>
</html>
