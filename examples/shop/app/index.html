<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barch Market</title>
<style>
  :root {
    --ink: #17202a; --muted: #6b7785; --line: #e3e8ef; --bg: #f4f6f5;
    --card: #ffffff; --accent: #1f8a3d; --accent2: #14532d; --accent-ink: #ffffff;
    --dark: #16222f; --good: #0a7d4f; --warn: #b4530a; --sale: #1f8a3d; --danger: #e0393e; --wish: #e0356b;
    --star: #f5a623; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 20; background: #fff;
           box-shadow: 0 2px 10px rgba(20,30,25,.08); }
  .bar { display: flex; align-items: center; gap: 18px; max-width: 1240px;
         margin: 0 auto; padding: 14px 20px; }
  .logo { font-weight: 800; font-size: 20px; line-height: 1.05; letter-spacing: -0.01em;
          white-space: nowrap; color: var(--accent2); text-transform: uppercase; }
  .logo small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em;
                color: var(--muted); text-transform: uppercase; }
  .logo span { color: var(--accent); }
  .search { flex: 1; display: flex; max-width: 620px; position: relative; }
  .search input { width: 100%; padding: 10px 46px 10px 15px; border: 1px solid var(--line);
                  border-radius: 999px; font: inherit; background: var(--bg); color: var(--ink); }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
  .search .go { position: absolute; right: 4px; top: 4px; width: 34px; height: 34px; padding: 0;
                border-radius: 50%; background: var(--dark); color: #fff; border: none;
                display: flex; align-items: center; justify-content: center; font-size: 15px; }
  button { font: inherit; cursor: pointer; border-radius: var(--radius);
           border: 1px solid var(--line); background: var(--card); padding: 8px 14px; }
  button:hover { border-color: #c9d2dd; }
  .primary { background: var(--dark); color: var(--accent-ink); border-color: var(--dark); }
  .primary:hover { background: #23394d; border-color: #23394d; }
  .primary[disabled] { background: #a8b6c2; border-color: #a8b6c2; cursor: not-allowed; }
  .head-btn { position: relative; white-space: nowrap; background: var(--bg);
              border-color: var(--line); color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .head-btn:hover { background: #eaeef0; border-color: #c9d2dd; }
  .pill { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px;
          font-weight: 700; padding: 1px 7px; margin-left: 2px; }
  .pill.wish { background: var(--wish); color: #fff; }
  .subbar { border-bottom: 1px solid var(--line); background: #fff; }
  .subbar .bar { padding: 8px 20px; gap: 26px; }
  .subbar a { display: flex; align-items: center; gap: 7px; color: var(--ink); text-decoration: none;
              font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .subbar a:hover { color: var(--accent2); }
  .subbar .fill { flex: 1; }

  main { max-width: 1240px; margin: 0 auto; padding: 20px; display: grid;
         grid-template-columns: 230px 1fr; gap: 24px; align-items: stretch; }
  nav { position: sticky; top: 90px; background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; padding: 10px; display: flex; flex-direction: column;
        max-height: calc(100vh - 106px); }
  nav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--muted); margin: 4px 0 8px 4px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 8px 8px; border-radius: 8px;
          color: var(--ink); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
  nav a:hover { background: var(--bg); }
  nav a.on { background: #e9f5ee; color: var(--accent2); border-left-color: var(--accent);
             font-weight: 600; }
  nav a.special { font-weight: 600; }
  nav .sub { padding-left: 26px; font-size: 13px; color: var(--muted); }
  nav .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  nav .icon { width: 20px; text-align: center; flex: none; font-size: 15px; }
  nav hr { border: none; border-top: 1px solid var(--line); margin: 10px 4px; }
  .nav-cats-wrap { position: relative; flex: 1; min-height: 120px; }
  .nav-cats { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
              scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .nav-cats::-webkit-scrollbar { width: 6px; }
  .nav-cats::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .nav-fade { position: absolute; left: 2px; right: 2px; height: 26px; pointer-events: none;
              transition: opacity .15s; z-index: 2; opacity: 0; }
  .nav-fade-top { top: 0; border-radius: 12px 12px 0 0;
                  background: linear-gradient(to bottom, var(--card), rgba(255,255,255,0)); }
  .nav-fade-bottom { bottom: 0; border-radius: 0 0 12px 12px;
                      background: linear-gradient(to top, var(--card), rgba(255,255,255,0)); }

  .banner { position: relative; border-radius: 14px; overflow: hidden; margin-bottom: 20px;
            min-height: 210px; display: flex; align-items: center; justify-content: flex-end;
            padding: 0 40px; background: linear-gradient(120deg, #dfe9df 0%, #cfe3d3 55%, #bfd9c6 100%); }
  .banner .blob { background: var(--accent2); color: #fff; border-radius: 50%; padding: 26px 40px;
                  font-size: 22px; font-weight: 700; text-align: center; line-height: 1.25;
                  box-shadow: 0 10px 26px rgba(20,60,35,.25); }
  .banner .dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex;
                  justify-content: center; gap: 6px; }
  .banner .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(20,30,25,.2); }
  .banner .dots span:first-child { background: var(--dark); }

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .head h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .count { color: var(--muted); font-size: 13px; }

  .recent { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 4px; }
  .recent .r-card { flex: none; width: 96px; text-align: center; cursor: pointer; }
  .recent .r-card .shot { width: 96px; height: 96px; border-radius: 8px; }
  .recent .r-card .t { font-size: 11px; color: var(--muted); margin-top: 4px;
                        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
             flex-wrap: wrap; margin-bottom: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line);
          background: var(--card); color: var(--ink); }
  .chip.on { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  #chip-sale.on { background: var(--sale); border-color: var(--sale); }
  #sort { padding: 7px 10px; border-radius: var(--radius); border: 1px solid var(--line);
          font: inherit; background: var(--card); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
          transition: box-shadow .12s ease, transform .12s ease; }
  .card:hover { box-shadow: 0 8px 22px rgba(20,60,35,.12); transform: translateY(-2px); }
  .shot { position: relative; aspect-ratio: 1; background: #fff; display: flex; align-items: center;
          justify-content: center; border-bottom: 1px solid var(--line); }
  .shot img { max-width: 88%; max-height: 88%; object-fit: contain; }
  .ribbon { position: absolute; top: 10px; left: 0; background: var(--accent); color: #fff;
            font-size: 11px; font-weight: 700; padding: 3px 10px 3px 8px; border-radius: 0 4px 4px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .heart { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; padding: 0;
           border-radius: 7px; border: 1px solid var(--line); background: rgba(255,255,255,.95); color: #c6cad2;
           font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
           box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  .heart.on { color: var(--wish); border-color: var(--wish); }
  .body { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .brand { font-size: 11.5px; color: var(--muted); }
  .name { font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
  .stars { font-size: 12px; color: var(--star); }
  .stars small { color: var(--muted); }
  .price { font-weight: 700; font-size: 16px; margin-top: auto; color: var(--ink); }
  .price s { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .price .off { color: var(--sale); font-weight: 700; font-size: 12px; margin-left: 6px; }
  .add-btn { width: 100%; margin-top: 8px; background: var(--dark); color: #fff; border-color: var(--dark);
             display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 0;
             font-weight: 600; font-size: 13.5px; }
  .add-btn:hover { background: #23394d; border-color: #23394d; }

  .more { text-align: center; padding: 24px 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .veil { position: fixed; inset: 0; background: rgba(15,10,35,.5); display: none;
          align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  .veil.on { display: flex; }
  .panel { background: var(--card); border-radius: 14px; max-width: 860px; width: 100%;
           max-height: 88vh; overflow: auto; }
  .panel .top { display: flex; justify-content: space-between; align-items: center;
                padding: 14px 18px; border-bottom: 1px solid var(--line);
                position: sticky; top: 0; background: var(--card); }
  .panel .top h2 { margin: 0; font-size: 16px; }
  .detail { display: grid; grid-template-columns: 320px 1fr; gap: 22px; padding: 18px; }
  .detail .shot { border: 1px solid var(--line); border-radius: var(--radius); aspect-ratio: 1; }
  .detail h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.3; }
  .desc { color: #3d4854; font-size: 14px; white-space: pre-wrap; margin: 10px 0 14px;
          max-height: 260px; overflow: auto; }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.good { background: #e4f6ee; color: var(--good); }
  .badge.warn { background: #fdeee2; color: var(--warn); }
  .seller { font-size: 12.5px; color: var(--muted); }
  .wish-toggle { display: flex; align-items: center; gap: 6px; }
  .wish-toggle.on { color: var(--wish); border-color: var(--wish); }

  .related { margin: 4px 18px 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .related h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--muted); margin: 0 0 10px; }
  .related .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .related .rcard { cursor: pointer; border: 1px solid var(--line); border-radius: 8px;
                     overflow: hidden; background: #fff; }
  .related .rcard .shot { aspect-ratio: 1; height: auto; }
  .related .rcard .t { font-size: 11.5px; padding: 6px 8px 0; display: -webkit-box;
                        -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .related .rcard .p { font-size: 12px; font-weight: 700; padding: 4px 8px 8px; }

  .reviews { margin: 4px 18px 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .reviews h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em;
                color: var(--muted); margin: 0 0 10px; }
  .reviews-sum { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .reviews-sum .avg { font-size: 22px; font-weight: 700; }
  .reviews-sum .stars { color: var(--star); font-size: 15px; }
  .reviews-sum .count { color: var(--muted); font-size: 13px; }
  .rate-form { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius);
               padding: 12px 14px; margin-bottom: 14px; }
  .rate-form .stars-in { font-size: 22px; color: #cfd6dc; cursor: pointer; user-select: none; }
  .rate-form .stars-in span.on { color: var(--star); }
  .rate-form textarea { width: 100%; margin: 8px 0; padding: 8px 10px; border: 1px solid var(--line);
                         border-radius: var(--radius); font: inherit; resize: vertical; min-height: 54px; }
  .rate-form .signin-hint { color: var(--muted); font-size: 13.5px; }
  .rate-form .signin-hint a { color: var(--accent2); font-weight: 600; }
  .review { padding: 10px 0; border-top: 1px solid var(--line); }
  .review:first-child { border-top: none; }
  .review .who { font-weight: 600; font-size: 13.5px; }
  .review .stars { color: var(--star); font-size: 13px; }
  .review .comment { font-size: 13.5px; color: #3d4854; margin-top: 3px; white-space: pre-wrap; }

  .lines { padding: 6px 18px 18px; }
  .line { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 12px;
          align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line img { width: 56px; height: 56px; object-fit: contain; }
  .line .t { font-size: 13.5px; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { padding: 2px 9px; }
  .total { display: flex; justify-content: space-between; font-weight: 700;
           font-size: 17px; padding: 14px 0 4px; color: var(--accent2); }
  form.checkout { display: grid; gap: 10px; padding: 4px 18px 20px; }
  form.checkout input, form.checkout textarea { padding: 9px 11px; border: 1px solid var(--line);
           border-radius: var(--radius); font: inherit; }
  .done { padding: 26px 18px 30px; text-align: center; }
  .done .tick { font-size: 34px; color: var(--good); }
  .note { color: var(--muted); font-size: 12.5px; }

  .toasts { position: fixed; bottom: 18px; right: 18px; z-index: 50; display: flex;
            flex-direction: column; gap: 8px; align-items: flex-end; }
  .toast { padding: 10px 16px; border-radius: 10px; color: #fff; font-size: 13.5px;
           box-shadow: 0 6px 18px rgba(0,0,0,.2); opacity: 1; transform: translateY(0);
           transition: opacity .3s, transform .3s; background: var(--ink); }
  .toast.success { background: var(--good); }
  .toast.error { background: var(--danger); }
  .toast.wish { background: var(--wish); }
  .toast.out { opacity: 0; transform: translateY(8px); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    nav { position: static; }
    .detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Barch<br><small>Market</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search 992 products…" autocomplete="off">
      <button class="go" tabindex="-1">🔍</button>
    </div>
    <button class="head-btn" id="wish-btn">♥ Wishlist<span class="pill wish" id="wpill">0</span></button>
    <button class="head-btn" id="basket-btn">🧺 Basket<span class="pill" id="pill">0</span></button>
    <button class="head-btn" id="account-btn">👤 Sign in</button>
  </div>
</header>
<div class="subbar">
  <div class="bar">
    <a href="#" id="deals-link">🔥 Deals</a>
    <a href="#" id="all-link">📦 All products</a>
    <a href="#" id="wishlist-link">♥ Wishlist</a>
    <span class="fill"></span>
    <a href="#" id="basket-link">🧺 <span id="pill2">0</span> items</a>
  </div>
</div>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="banner">
      <div class="blob">Today's<br>Best Picks</div>
      <div class="dots"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="head">
      <h1 id="title">All products</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="recent" id="recent"></div>
    <div class="toolbar">
      <div class="chips">
        <button class="chip" id="chip-sale" onclick="toggleSale()">🔥 On sale</button>
        <button class="chip on" data-r="0" onclick="setRating(0)">All ratings</button>
        <button class="chip" data-r="4" onclick="setRating(4)">4★ &amp; up</button>
        <button class="chip" data-r="3" onclick="setRating(3)">3★ &amp; up</button>
      </div>
      <select id="sort" onchange="apply()">
        <option value="rel">Sort: relevance</option>
        <option value="price_asc">Price: low to high</option>
        <option value="price_desc">Price: high to low</option>
        <option value="rating">Top rated</option>
        <option value="discount">Biggest discount</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more"></div>
  </section>
</main>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<div class="toasts" id="toasts"></div>

<script>
const PAGE = 24;
const PALETTE = ["#e0393e","#1a6fdc","#0a7d4f","#b4530a","#8e44ad","#16a085",
                  "#d35400","#2c3e50","#c0392b","#2980b9","#f39c12","#27ae60"];
let index = [], cats = [], view = [], shown = 0;
let cat = null, sub = null, catName = null, subName = null, term = "";
let mode = null;          // null | "deals" | "wishlist"
let onlySale = false, minRating = 0;
let basket = load("basket", {});
let wishlist = load("wishlist", {});
let recent = load("recent", []);

function load(k, dflt) { try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const money = (n, c) => (c === "INR" ? "₹" : c === "GBP" ? "£" : "$") +
  n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
// every image goes through /img, which fetches it once and keeps it
const shot = asin => "/img/" + encodeURIComponent(asin);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));
const discountOf = p => (p.was && p.was > p.price) ? Math.round((1 - p.price / p.was) * 100) : 0;

function iconFor(slug) {
  const icons = {
    "arts-crafts-sewing": "🎨", "automotive": "🚗", "baby-products": "🍼",
    "beauty-personal-care": "💄", "beauty": "💅", "cell-phones-accessories": "📱",
    "clothing-shoes-jewelry": "👗", "electronics": "🔌", "grocery-gourmet-food": "🛒",
    "health-household": "🏠", "hobbies": "🎯", "home-kitchen": "🍳",
    "industrial-scientific": "🔬", "movies-tv": "🎬", "musical-instruments": "🎸",
    "office-products": "🖇️", "other": "🏷️", "patio-lawn-garden": "🌿",
    "pet-supplies": "🐾", "remote-app-controlled-vehicle-parts": "🚁",
    "remote-app-controlled-vehicles-parts": "🚁", "sports-outdoors": "🏀",
    "tools-home-improvement": "🛠️", "toys-games": "🧸", "video-games": "🎮",
  };
  return icons[slug] || "🏷️";
}

function colorFor(slug) {
  let h = 0;
  for (let i = 0; i < (slug || "").length; i++) h = (h * 31 + slug.charCodeAt(i)) | 0;
  return PALETTE[Math.abs(h) % PALETTE.length];
}

function toast(msg, kind) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.classList.add("out"), 1700);
  setTimeout(() => el.remove(), 2100);
}

let me = null; // {email, name} once signed in, else null

function drawAccount() {
  const btn = document.getElementById("account-btn");
  if (me) {
    btn.textContent = "👤 " + (me.name || me.email);
    btn.onclick = async () => {
      await fetch("/api/signout", { method: "POST" });
      me = null;
      drawAccount();
      toast("Signed out");
    };
  } else {
    btn.textContent = "👤 Sign in";
    btn.onclick = () => location.href = "/shop/signon.html";
  }
}

async function boot() {
  const [idx, c, who] = await Promise.all([
    fetch("/api/index").then(r => r.json()),
    fetch("/api/categories").then(r => r.json()),
    fetch("/api/me").then(r => r.json()).catch(() => ({ user: null })),
  ]);
  index = idx;
  cats = c;
  me = who.user || null;
  drawAccount();
  document.getElementById("q").placeholder = `Search ${index.length} products…`;
  drawNav();
  apply();
  wishCount();
  count();
}

function goto(next) {
  next();
  apply();
  drawNav();
}

function drawNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "<h3>Browse</h3>";

  const deals = document.createElement("a");
  deals.className = "special" + (mode === "deals" ? " on" : "");
  deals.href = "#";
  deals.innerHTML = "🔥 Today's deals";
  deals.onclick = e => { e.preventDefault(); goto(() => { mode = "deals"; cat = sub = catName = subName = null; }); };
  nav.appendChild(deals);

  const wish = document.createElement("a");
  wish.className = "special" + (mode === "wishlist" ? " on" : "");
  wish.href = "#";
  wish.innerHTML = "♥ My wishlist";
  wish.onclick = e => { e.preventDefault(); goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; }); };
  nav.appendChild(wish);

  nav.appendChild(document.createElement("hr"));

  const all = document.createElement("a");
  all.textContent = "All products";
  all.href = "#";
  all.className = (!mode && !cat) ? "on" : "";
  all.onclick = e => { e.preventDefault(); goto(() => { mode = cat = sub = catName = subName = null; }); };
  nav.appendChild(all);

  const wrap = document.createElement("div");
  wrap.className = "nav-cats-wrap";
  const catsBox = document.createElement("div");
  catsBox.className = "nav-cats";
  const fadeTop = document.createElement("div");
  fadeTop.className = "nav-fade nav-fade-top";
  const fadeBot = document.createElement("div");
  fadeBot.className = "nav-fade nav-fade-bottom";
  wrap.appendChild(catsBox);
  wrap.appendChild(fadeTop);
  wrap.appendChild(fadeBot);
  nav.appendChild(wrap);

  for (const c of cats) {
    const a = document.createElement("a");
    a.href = "#";
    a.className = (!mode && cat === c.slug && !sub) ? "on" : "";
    a.innerHTML = `<span class="icon">${iconFor(c.slug)}</span>${esc(c.name)}`;
    a.onclick = e => { e.preventDefault(); goto(() => { mode = null; cat = c.slug; catName = c.name; sub = null; }); };
    catsBox.appendChild(a);
    if (!mode && cat === c.slug) {
      for (const s of c.subs) {
        const b = document.createElement("a");
        b.href = "#";
        b.className = "sub" + (sub === s.slug ? " on" : "");
        b.textContent = s.name;
        b.onclick = e => { e.preventDefault(); goto(() => { sub = s.slug; subName = s.name; }); };
        catsBox.appendChild(b);
      }
    }
  }

  const updateFade = () => {
    fadeTop.style.opacity = catsBox.scrollTop > 4 ? "1" : "0";
    const atBottom = catsBox.scrollTop + catsBox.clientHeight >= catsBox.scrollHeight - 4;
    fadeBot.style.opacity = atBottom ? "0" : "1";
  };
  catsBox.addEventListener("scroll", updateFade);
  updateFade();
}

function toggleSale() {
  onlySale = !onlySale;
  document.getElementById("chip-sale").classList.toggle("on", onlySale);
  apply();
}

function setRating(r) {
  minRating = r;
  document.querySelectorAll("[data-r]").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
  apply();
}

function sortView() {
  const by = document.getElementById("sort").value;
  const sorters = {
    price_asc: (a, b) => a.price - b.price,
    price_desc: (a, b) => b.price - a.price,
    rating: (a, b) => b.rating - a.rating,
    discount: (a, b) => discountOf(b) - discountOf(a),
  };
  if (sorters[by]) view.sort(sorters[by]);
}

function apply() {
  const t = term.trim().toLowerCase();
  let base = index;
  if (mode === "wishlist") base = index.filter(p => wishlist[p.asin]);
  else if (mode === "deals") base = index.filter(p => discountOf(p) > 0);

  view = base.filter(p => {
    if (!mode) {
      if (cat && p.top !== cat) return false;
      if (sub && p.sub !== sub) return false;
    }
    if (onlySale && discountOf(p) <= 0) return false;
    if (minRating && p.rating < minRating) return false;
    if (t && !(p.title.toLowerCase().includes(t) || (p.brand || "").toLowerCase().includes(t))) return false;
    return true;
  });
  sortView();

  document.getElementById("title").textContent =
    mode === "wishlist" ? "My wishlist" : mode === "deals" ? "Today's deals" : (subName || catName || "All products");
  document.getElementById("count").textContent =
    view.length + (view.length === 1 ? " product" : " products");
  document.getElementById("grid").innerHTML = "";
  shown = 0;
  page();
  renderRecent();
}

function renderRecent() {
  const box = document.getElementById("recent");
  const show = !mode && !cat && !term && recent.length;
  if (!show) { box.innerHTML = ""; return; }
  const items = recent.map(a => index.find(p => p.asin === a)).filter(Boolean).slice(0, 8);
  if (!items.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div style="width:100%;font-size:12px;color:var(--muted);margin-bottom:-8px">Recently viewed</div>` +
    items.map(p => `
      <div class="r-card" onclick="openProduct('${p.asin}')">
        <div class="shot"><img loading="lazy" alt="" src="${shot(p.asin)}"></div>
        <div class="t">${esc(p.title)}</div>
      </div>`).join("");
}

function page() {
  const grid = document.getElementById("grid");
  for (const p of view.slice(shown, shown + PAGE)) {
    const off = discountOf(p);
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="shot">
        ${off ? `<div class="ribbon">-${off}%</div>` : ""}
        <button class="heart${wishlist[p.asin] ? " on" : ""}" data-asin="${p.asin}"
                onclick="toggleWish(this,'${p.asin}',event)" title="Wishlist">♥</button>
        <img loading="lazy" alt="" src="${shot(p.asin)}">
      </div>
      <div class="body">
        <div class="brand">${esc(p.brand) || "&nbsp;"}</div>
        <div class="name">${esc(p.title)}</div>
        <div class="stars">${stars(p.rating)} <small>${p.reviews.toLocaleString()}</small></div>
        <div class="price">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}${off ? `<span class="off">-${off}%</span>` : ""}</div>
        <button class="add-btn" onclick="quickAdd('${p.asin}',event)">🛒 Add</button>
      </div>`;
    card.onclick = () => openProduct(p.asin);
    grid.appendChild(card);
  }
  shown = Math.min(shown + PAGE, view.length);
  const more = document.getElementById("more");
  more.innerHTML = "";
  if (!view.length) {
    more.innerHTML = `<div class="empty">${mode === "wishlist" ? "Your wishlist is empty." : "Nothing matches that."}</div>`;
  } else if (shown < view.length) {
    const b = document.createElement("button");
    b.textContent = `Show more (${view.length - shown} left)`;
    b.onclick = page;
    more.appendChild(b);
  }
}

function quickAdd(asin, ev) {
  ev.stopPropagation();
  const row = index.find(p => p.asin === asin);
  if (!row) return;
  addToBasket({ asin: row.asin, title: row.title, price: row.price, currency: row.currency });
  toast("Added to basket", "success");
}

function toggleWish(btn, asin, ev) {
  ev.stopPropagation();
  if (wishlist[asin]) {
    delete wishlist[asin];
    toast("Removed from wishlist");
  } else {
    wishlist[asin] = true;
    toast("Added to wishlist ♥", "wish");
  }
  save("wishlist", wishlist);
  btn.classList.toggle("on", !!wishlist[asin]);
  wishCount();
  if (mode === "wishlist" && !wishlist[asin]) {
    const card = btn.closest(".card");
    if (card) card.remove();
    view = view.filter(p => p.asin !== asin);
    document.getElementById("count").textContent = view.length + (view.length === 1 ? " product" : " products");
    if (!view.length) document.getElementById("more").innerHTML = '<div class="empty">Your wishlist is empty.</div>';
  }
}

function wishCount() {
  document.getElementById("wpill").textContent = Object.keys(wishlist).length;
}

function recordRecent(asin) {
  recent = recent.filter(a => a !== asin);
  recent.unshift(asin);
  recent = recent.slice(0, 10);
  save("recent", recent);
}

async function openProduct(asin) {
  const p = await fetch("/api/product/" + encodeURIComponent(asin)).then(r => r.json());
  if (p.error) return;
  recordRecent(p.asin);
  const row = index.find(x => x.asin === p.asin) || {};
  const off = discountOf({ price: p.price, was: p.was });
  const wished = !!wishlist[p.asin];
  const rel = index.filter(x => x.asin !== p.asin && row.sub && x.sub === row.sub).slice(0, 6)
    .concat(index.filter(x => x.asin !== p.asin && row.top && x.top === row.top && x.sub !== row.sub))
    .slice(0, 6);

  show(`
    <div class="top"><h2>Product</h2><button onclick="shut()">Close</button></div>
    <div class="detail">
      <div class="shot">${off ? `<div class="ribbon">-${off}%</div>` : ""}
        <img alt="" src="${shot(p.asin)}"></div>
      <div>
        <div class="crumbs">${p.categories.map(esc).join(" &rsaquo; ")}</div>
        <h2>${esc(p.title)}</h2>
        <div class="brand"><span class="dot" style="background:${colorFor(row.top || "")}"></span>${esc(p.brand)}</div>
        ${p.seller ? `<div class="seller">Sold by ${esc(p.seller)}</div>` : ""}
        <div class="stars" style="margin-top:6px">${stars(p.rating)} <small>${p.reviews.toLocaleString()} reviews</small></div>
        <div class="price" style="margin:10px 0">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}${off ? `<span class="off">-${off}%</span>` : ""}</div>
        <div class="row">
          <button class="primary" onclick='addToBasketJson(${JSON.stringify(JSON.stringify({
            asin: p.asin, title: p.title, price: p.price, currency: p.currency }))}); toast("Added to basket","success")'>Add to basket</button>
          <button class="wish-toggle${wished ? " on" : ""}" onclick="toggleWishDetail(this,'${p.asin}')">♥ ${wished ? "Wishlisted" : "Wishlist"}</button>
          ${p.availability ? `<span class="badge ${/out of stock/i.test(p.availability) ? "warn" : "good"}">${esc(p.availability)}</span>` : ""}
        </div>
        <div class="desc">${esc(p.description) || "No description."}</div>
      </div>
    </div>
    ${rel.length ? `
    <div class="related">
      <h3>You might also like</h3>
      <div class="rgrid">
        ${rel.map(r => `
          <div class="rcard" onclick="openProduct('${r.asin}')">
            <div class="shot"><img loading="lazy" alt="" src="${shot(r.asin)}"></div>
            <div class="t">${esc(r.title)}</div>
            <div class="p">${money(r.price, r.currency)}</div>
          </div>`).join("")}
      </div>
    </div>` : ""}
    <div class="reviews" id="reviews" data-asin="${p.asin}"><h3>Ratings & reviews</h3></div>`);
  loadRatings(p.asin);
}

// The user-submitted rating, kept apart from p.rating/p.reviews - those two
// come from the imported catalog and never change; this is what shoppers
// using this storefront have actually said, stored in shopapi.luau's own
// rating:<asin>:<email> keys.
let myStars = 0;

function ratingStars(pick, current) {
  let out = "";
  for (let i = 1; i <= 5; i++) {
    out += `<span class="${i <= current ? "on" : ""}" onclick="${pick ? `pickStars(${i})` : ""}">★</span>`;
  }
  return out;
}

function pickStars(n) {
  myStars = n;
  const box = document.getElementById("reviews");
  if (box) box.querySelectorAll(".stars-in span").forEach((el, i) => el.classList.toggle("on", i < n));
}

async function loadRatings(asin) {
  const box = document.getElementById("reviews");
  if (!box || box.dataset.asin !== asin) return;
  const r = await fetch("/api/ratings/" + encodeURIComponent(asin)).then(x => x.json());
  if (r.error) return;
  myStars = r.mine ? r.mine.stars : 0;
  box.innerHTML = `
    <h3>Ratings & reviews</h3>
    <div class="reviews-sum">
      <span class="avg">${r.count ? r.average.toFixed(1) : "—"}</span>
      <span class="stars">${stars(r.average)}</span>
      <span class="count">${r.count ? r.count.toLocaleString() + (r.count === 1 ? " rating" : " ratings") : "No ratings yet"}</span>
    </div>
    <div class="rate-form">
      ${me ? `
        <div>${r.mine ? "Update your rating" : "Rate this product"}</div>
        <div class="stars-in">${ratingStars(true, myStars)}</div>
        <textarea id="review-text" placeholder="Add a review (optional)">${esc(r.mine ? r.mine.comment : "")}</textarea>
        <button class="primary" onclick="submitRating('${asin}')">Submit</button>
      ` : `<div class="signin-hint"><a href="/shop/signon.html">Sign in</a> to rate this product</div>`}
    </div>
    ${r.reviews.map(rv => `
      <div class="review">
        <div class="who">${esc(rv.name)}</div>
        <div class="stars">${stars(rv.stars)}</div>
        ${rv.comment ? `<div class="comment">${esc(rv.comment)}</div>` : ""}
      </div>`).join("")}`;
}

async function submitRating(asin) {
  if (myStars < 1) return toast("Pick a star rating first");
  const comment = document.getElementById("review-text").value;
  const r = await fetch("/api/ratings", {
    method: "POST",
    body: JSON.stringify({ asin, stars: myStars, comment }),
  }).then(x => x.json());
  if (r.error) return toast(r.error);
  toast("Thanks for rating this product", "success");
  loadRatings(asin);
}

function toggleWishDetail(btn, asin) {
  if (wishlist[asin]) {
    delete wishlist[asin];
    toast("Removed from wishlist");
  } else {
    wishlist[asin] = true;
    toast("Added to wishlist ♥", "wish");
  }
  save("wishlist", wishlist);
  const on = !!wishlist[asin];
  btn.classList.toggle("on", on);
  btn.innerHTML = "♥ " + (on ? "Wishlisted" : "Wishlist");
  wishCount();
  document.querySelectorAll(`.heart[data-asin="${asin}"]`).forEach(b => b.classList.toggle("on", on));
}

function addToBasketJson(json) { addToBasket(JSON.parse(json)); }

function addToBasket(p) {
  const have = basket[p.asin];
  basket[p.asin] = { ...p, qty: (have ? have.qty : 0) + 1 };
  save("basket", basket);
  count();
}

function count() {
  const n = Object.values(basket).reduce((a, b) => a + b.qty, 0);
  document.getElementById("pill").textContent = n;
  document.getElementById("pill2").textContent = n;
}

function total() {
  return Object.values(basket).reduce((a, b) => a + b.price * b.qty, 0);
}

function bump(asin, by) {
  const line = basket[asin];
  if (!line) return;
  line.qty += by;
  if (line.qty < 1) delete basket[asin];
  save("basket", basket);
  count();
  openBasket();
}

function openBasket() {
  const lines = Object.values(basket);
  if (!lines.length) {
    return show(`<div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
      <div class="empty" style="padding:44px 20px">Your basket is empty.</div>`);
  }
  show(`
    <div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
    <div class="lines">
      ${lines.map(l => `
        <div class="line">
          <img alt="" src="${shot(l.asin)}">
          <div class="t">${esc(l.title)}</div>
          <div class="qty">
            <button onclick="bump('${l.asin}',-1)">−</button>${l.qty}
            <button onclick="bump('${l.asin}',1)">+</button>
          </div>
          <div>${money(l.price * l.qty, l.currency)}</div>
        </div>`).join("")}
      <div class="total"><span>Total</span><span>${money(total(), "USD")}</span></div>
    </div>
    <form class="checkout" onsubmit="return checkout(event)">
      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <textarea name="address" rows="2" placeholder="Address" required></textarea>
      <button class="primary" type="submit">Place order</button>
      <div class="note">Nothing is charged. The order is written to a key in this space.</div>
    </form>`);
}

async function checkout(ev) {
  ev.preventDefault();
  const f = ev.target;
  f.querySelector("button").disabled = true;
  const body = {
    name: f.name.value, email: f.email.value, address: f.address.value,
    placed: new Date().toISOString(),
    items: Object.values(basket).map(l => ({ asin: l.asin, qty: l.qty })),
  };
  const out = await fetch("/api/order", { method: "POST", body: JSON.stringify(body) })
    .then(r => r.json()).catch(e => ({ error: String(e) }));
  if (out.error) {
    f.querySelector("button").disabled = false;
    toast("Could not place the order: " + out.error, "error");
    return false;
  }
  basket = {};
  save("basket", basket);
  count();
  show(`<div class="top"><h2>Order placed</h2><button onclick="shut()">Close</button></div>
    <div class="done">
      <div class="tick">✓</div>
      <p>Thank you. Your order is <strong>${esc(out.order.id)}</strong>,
         ${money(out.order.total, out.order.currency)} for
         ${out.order.items.length} item${out.order.items.length === 1 ? "" : "s"}.</p>
      <p class="note">Stored as <code>order:${esc(out.order.id)}</code>. Priced on the
         server from the catalog, not from the basket.</p>
    </div>`);
  toast("Order placed", "success");
  return false;
}

function show(html) {
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function shut() { document.getElementById("veil").classList.remove("on"); }

document.getElementById("q").addEventListener("input", e => { term = e.target.value; apply(); });
document.getElementById("basket-btn").onclick = openBasket;
document.getElementById("basket-link").onclick = e => { e.preventDefault(); openBasket(); };
document.getElementById("wish-btn").onclick = () => goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; });
document.getElementById("wishlist-link").onclick = e => { e.preventDefault(); goto(() => { mode = "wishlist"; cat = sub = catName = subName = null; }); };
document.getElementById("deals-link").onclick = e => { e.preventDefault(); goto(() => { mode = "deals"; cat = sub = catName = subName = null; }); };
document.getElementById("all-link").onclick = e => { e.preventDefault(); goto(() => { mode = cat = sub = catName = subName = null; }); };
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") shut(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
boot();
</script>
</body>
</html>
