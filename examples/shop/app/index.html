<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barch Market</title>
<style>
  :root {
    --ink: #17202a; --muted: #6b7785; --line: #e3e8ef; --bg: #f7f8fa;
    --card: #ffffff; --accent: #1a6fdc; --accent-ink: #ffffff; --good: #0a7d4f;
    --warn: #b4530a; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { position: sticky; top: 0; z-index: 20; background: var(--card);
           border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 16px; max-width: 1180px;
         margin: 0 auto; padding: 12px 20px; }
  .logo { font-weight: 650; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .search { flex: 1; display: flex; }
  .search input { width: 100%; padding: 9px 13px; border: 1px solid var(--line);
                  border-radius: var(--radius); font: inherit; background: var(--bg); }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: #fff; }
  button { font: inherit; cursor: pointer; border-radius: var(--radius);
           border: 1px solid var(--line); background: var(--card); padding: 8px 14px; }
  button:hover { border-color: #c9d2dd; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary:hover { background: #145bb5; border-color: #145bb5; }
  .primary[disabled] { background: #a8bdd8; border-color: #a8bdd8; cursor: not-allowed; }
  .basket-btn { position: relative; white-space: nowrap; }
  .pill { background: var(--accent); color: #fff; border-radius: 999px; font-size: 12px;
          padding: 1px 7px; margin-left: 6px; }

  main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid;
         grid-template-columns: 220px 1fr; gap: 24px; align-items: start; }
  nav { position: sticky; top: 66px; }
  nav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
           color: var(--muted); margin: 0 0 8px; }
  nav a { display: block; padding: 5px 8px; border-radius: 7px; color: var(--ink);
          text-decoration: none; font-size: 14px; }
  nav a:hover { background: #eef2f7; }
  nav a.on { background: var(--accent); color: #fff; }
  nav .sub { padding-left: 18px; font-size: 13px; color: var(--muted); }

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .head h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .count { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
          transition: box-shadow .12s ease, transform .12s ease; }
  .card:hover { box-shadow: 0 6px 20px rgba(20,40,80,.09); transform: translateY(-2px); }
  .shot { aspect-ratio: 1; background: #fff; display: flex; align-items: center;
          justify-content: center; border-bottom: 1px solid var(--line); }
  .shot img { max-width: 88%; max-height: 88%; object-fit: contain; }
  .body { padding: 11px 12px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .brand { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .name { font-size: 13.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
  .stars { font-size: 12px; color: var(--warn); }
  .stars small { color: var(--muted); }
  .price { font-weight: 650; font-size: 16px; margin-top: auto; }
  .price s { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }

  .more { text-align: center; padding: 24px 0; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .veil { position: fixed; inset: 0; background: rgba(15,25,40,.45); display: none;
          align-items: center; justify-content: center; padding: 20px; z-index: 30; }
  .veil.on { display: flex; }
  .panel { background: var(--card); border-radius: 14px; max-width: 860px; width: 100%;
           max-height: 88vh; overflow: auto; }
  .panel .top { display: flex; justify-content: space-between; align-items: center;
                padding: 14px 18px; border-bottom: 1px solid var(--line);
                position: sticky; top: 0; background: var(--card); }
  .panel .top h2 { margin: 0; font-size: 16px; }
  .detail { display: grid; grid-template-columns: 320px 1fr; gap: 22px; padding: 18px; }
  .detail .shot { border: 1px solid var(--line); border-radius: var(--radius); aspect-ratio: 1; }
  .detail h2 { margin: 0 0 6px; font-size: 19px; line-height: 1.3; }
  .desc { color: #3d4854; font-size: 14px; white-space: pre-wrap; margin: 10px 0 14px;
          max-height: 260px; overflow: auto; }
  .crumbs { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }

  .lines { padding: 6px 18px 18px; }
  .line { display: grid; grid-template-columns: 56px 1fr auto auto; gap: 12px;
          align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line img { width: 56px; height: 56px; object-fit: contain; }
  .line .t { font-size: 13.5px; }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button { padding: 2px 9px; }
  .total { display: flex; justify-content: space-between; font-weight: 650;
           font-size: 17px; padding: 14px 0 4px; }
  form.checkout { display: grid; gap: 10px; padding: 4px 18px 20px; }
  form.checkout input, form.checkout textarea { padding: 9px 11px; border: 1px solid var(--line);
           border-radius: var(--radius); font: inherit; }
  .done { padding: 26px 18px 30px; text-align: center; }
  .done .tick { font-size: 34px; color: var(--good); }
  .note { color: var(--muted); font-size: 12.5px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; }
    nav { position: static; }
    .detail { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">Barch <span>Market</span></div>
    <div class="search"><input id="q" type="search" placeholder="Search 992 products…" autocomplete="off"></div>
    <button class="basket-btn" id="basket-btn">Basket<span class="pill" id="pill">0</span></button>
  </div>
</header>

<main>
  <nav id="nav"></nav>
  <section>
    <div class="head">
      <h1 id="title">All products</h1>
      <div class="count" id="count"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="more" id="more"></div>
  </section>
</main>

<div class="veil" id="veil"><div class="panel" id="panel"></div></div>

<script>
const PAGE = 24;
let index = [], view = [], shown = 0, cat = null, sub = null, catName = null, subName = null, term = "";
let basket = load("basket", {});

function load(k, dflt) { try { return JSON.parse(localStorage.getItem(k)) || dflt; } catch (e) { return dflt; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const money = (n, c) => (c === "INR" ? "₹" : c === "GBP" ? "£" : "$") +
  n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
// every image goes through /img, which fetches it once and keeps it
const shot = asin => "/img/" + encodeURIComponent(asin);
const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stars = r => "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r));

async function boot() {
  const [idx, cats] = await Promise.all([
    fetch("/api/index").then(r => r.json()),
    fetch("/api/categories").then(r => r.json()),
  ]);
  index = idx;
  document.getElementById("q").placeholder = `Search ${index.length} products…`;
  drawNav(cats);
  apply();
  count();
}

function drawNav(cats) {
  const nav = document.getElementById("nav");
  nav.innerHTML = "<h3>Categories</h3>";
  const all = document.createElement("a");
  all.textContent = "All products";
  all.href = "#";
  all.className = cat ? "" : "on";
  all.onclick = e => { e.preventDefault(); cat = sub = catName = subName = null; apply(); drawNav(cats); };
  nav.appendChild(all);
  for (const c of cats) {
    const a = document.createElement("a");
    a.textContent = c.name;
    a.href = "#";
    a.className = cat === c.slug && !sub ? "on" : "";
    a.onclick = e => { e.preventDefault(); cat = c.slug; catName = c.name; sub = null; apply(); drawNav(cats); };
    nav.appendChild(a);
    if (cat === c.slug) {
      for (const s of c.subs) {
        const b = document.createElement("a");
        b.textContent = s.name;
        b.href = "#";
        b.className = "sub" + (sub === s.slug ? " on" : "");
        b.onclick = e => { e.preventDefault(); sub = s.slug; subName = s.name; apply(); drawNav(cats); };
        nav.appendChild(b);
      }
    }
  }
}

function apply() {
  const t = term.trim().toLowerCase();
  view = index.filter(p =>
    (!cat || p.top === cat) && (!sub || p.sub === sub) &&
    (!t || p.title.toLowerCase().includes(t) || (p.brand || "").toLowerCase().includes(t)));
  document.getElementById("title").textContent = subName || catName || "All products";
  document.getElementById("count").textContent =
    view.length + (view.length === 1 ? " product" : " products");
  document.getElementById("grid").innerHTML = "";
  shown = 0;
  page();
}

function page() {
  const grid = document.getElementById("grid");
  for (const p of view.slice(shown, shown + PAGE)) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="shot"><img loading="lazy" alt="" src="${shot(p.asin)}"></div>
      <div class="body">
        <div class="brand">${esc(p.brand) || "&nbsp;"}</div>
        <div class="name">${esc(p.title)}</div>
        <div class="stars">${stars(p.rating)} <small>${p.reviews.toLocaleString()}</small></div>
        <div class="price">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}</div>
      </div>`;
    card.onclick = () => open(p.asin);
    grid.appendChild(card);
  }
  shown = Math.min(shown + PAGE, view.length);
  const more = document.getElementById("more");
  more.innerHTML = "";
  if (!view.length) {
    more.innerHTML = '<div class="empty">Nothing matches that.</div>';
  } else if (shown < view.length) {
    const b = document.createElement("button");
    b.textContent = `Show more (${view.length - shown} left)`;
    b.onclick = page;
    more.appendChild(b);
  }
}

async function open(asin) {
  const p = await fetch("/api/product/" + encodeURIComponent(asin)).then(r => r.json());
  if (p.error) return;
  show(`
    <div class="top"><h2>Product</h2><button onclick="shut()">Close</button></div>
    <div class="detail">
      <div class="shot"><img alt="" src="${shot(p.asin)}"></div>
      <div>
        <div class="crumbs">${p.categories.map(esc).join(" &rsaquo; ")}</div>
        <h2>${esc(p.title)}</h2>
        <div class="brand">${esc(p.brand)}</div>
        <div class="stars">${stars(p.rating)} <small>${p.reviews.toLocaleString()} reviews</small></div>
        <div class="price" style="margin:10px 0">${money(p.price, p.currency)}${p.was ? `<s>${money(p.was, p.currency)}</s>` : ""}</div>
        <div class="row">
          <button class="primary" onclick='add(${JSON.stringify(JSON.stringify({
            asin: p.asin, title: p.title, price: p.price, currency: p.currency }))})'>Add to basket</button>
          <span class="note">${esc(p.availability || "")}</span>
        </div>
        <div class="desc">${esc(p.description) || "No description."}</div>
      </div>
    </div>`);
}

function add(json) {
  const p = JSON.parse(json);
  const have = basket[p.asin];
  basket[p.asin] = { ...p, qty: (have ? have.qty : 0) + 1 };
  save("basket", basket);
  count();
  shut();
}

function count() {
  const n = Object.values(basket).reduce((a, b) => a + b.qty, 0);
  document.getElementById("pill").textContent = n;
}

function total() {
  return Object.values(basket).reduce((a, b) => a + b.price * b.qty, 0);
}

function bump(asin, by) {
  const line = basket[asin];
  if (!line) return;
  line.qty += by;
  if (line.qty < 1) delete basket[asin];
  save("basket", basket);
  count();
  openBasket();
}

function openBasket() {
  const lines = Object.values(basket);
  if (!lines.length) {
    return show(`<div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
      <div class="empty" style="padding:44px 20px">Your basket is empty.</div>`);
  }
  show(`
    <div class="top"><h2>Basket</h2><button onclick="shut()">Close</button></div>
    <div class="lines">
      ${lines.map(l => `
        <div class="line">
          <img alt="" src="${shot(l.asin)}">
          <div class="t">${esc(l.title)}</div>
          <div class="qty">
            <button onclick="bump('${l.asin}',-1)">−</button>${l.qty}
            <button onclick="bump('${l.asin}',1)">+</button>
          </div>
          <div>${money(l.price * l.qty, l.currency)}</div>
        </div>`).join("")}
      <div class="total"><span>Total</span><span>${money(total(), "USD")}</span></div>
    </div>
    <form class="checkout" onsubmit="return checkout(event)">
      <input name="name" placeholder="Name" required>
      <input name="email" type="email" placeholder="Email" required>
      <textarea name="address" rows="2" placeholder="Address" required></textarea>
      <button class="primary" type="submit">Place order</button>
      <div class="note">Nothing is charged. The order is written to a key in this space.</div>
    </form>`);
}

async function checkout(ev) {
  ev.preventDefault();
  const f = ev.target;
  f.querySelector("button").disabled = true;
  const body = {
    name: f.name.value, email: f.email.value, address: f.address.value,
    placed: new Date().toISOString(),
    items: Object.values(basket).map(l => ({ asin: l.asin, qty: l.qty })),
  };
  const out = await fetch("/api/order", { method: "POST", body: JSON.stringify(body) })
    .then(r => r.json()).catch(e => ({ error: String(e) }));
  if (out.error) {
    f.querySelector("button").disabled = false;
    return alert("Could not place the order: " + out.error);
  }
  basket = {};
  save("basket", basket);
  count();
  show(`<div class="top"><h2>Order placed</h2><button onclick="shut()">Close</button></div>
    <div class="done">
      <div class="tick">✓</div>
      <p>Thank you. Your order is <strong>${esc(out.order.id)}</strong>,
         ${money(out.order.total, out.order.currency)} for
         ${out.order.items.length} item${out.order.items.length === 1 ? "" : "s"}.</p>
      <p class="note">Stored as <code>order:${esc(out.order.id)}</code>. Priced on the
         server from the catalog, not from the basket.</p>
    </div>`);
  return false;
}

function show(html) {
  document.getElementById("panel").innerHTML = html;
  document.getElementById("veil").classList.add("on");
}
function shut() { document.getElementById("veil").classList.remove("on"); }

document.getElementById("q").addEventListener("input", e => { term = e.target.value; apply(); });
document.getElementById("basket-btn").onclick = openBasket;
document.getElementById("veil").onclick = e => { if (e.target.id === "veil") shut(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") shut(); });
boot();
</script>
</body>
</html>
