<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Barch Market</title>
<style>
  :root {
    --ink: #17202a; --muted: #6b7785; --line: #e3e8ef; --bg: #f4f6f5;
    --card: #ffffff; --accent: #1f8a3d; --accent2: #14532d; --accent-ink: #ffffff;
    --dark: #16222f; --danger: #e0393e; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 20px;
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          max-width: 380px; width: 100%; padding: 28px 26px; box-shadow: 0 8px 30px rgba(20,30,25,.08); }
  .logo { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; color: var(--accent2);
          text-transform: uppercase; margin-bottom: 4px; }
  .logo span { color: var(--accent); }
  h1 { font-size: 18px; margin: 4px 0 18px; }
  form { display: grid; gap: 12px; }
  label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
          font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border-radius: var(--radius); border: 1px solid var(--dark);
           background: var(--dark); color: #fff; padding: 10px 0; font-weight: 600; margin-top: 4px; }
  button:hover { background: #23394d; }
  button[disabled] { background: #a8b6c2; border-color: #a8b6c2; cursor: not-allowed; }
  .err { background: #fdecec; color: var(--danger); border-radius: var(--radius); padding: 8px 11px;
         font-size: 13px; display: none; }
  .foot { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
  .foot a { color: var(--accent2); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Barch<span>Market</span></div>
  <h1>Create your account</h1>
  <div class="err" id="err"></div>
  <form id="f">
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="Ada Lovelace">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6"
             placeholder="At least 6 characters">
    </div>
    <button type="submit">Create account</button>
  </form>
  <div class="foot">Already registered? <a href="/shop/signon.html">Sign in</a></div>
</div>
<script>
const f = document.getElementById("f");
const err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  err.style.display = "none";
  const btn = f.querySelector("button");
  btn.disabled = true;
  const body = { name: f.name.value, email: f.email.value, password: f.password.value };
  try {
    const r = await fetch("/api/register", { method: "POST", body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok || out.error) throw new Error(out.error || "could not register");
    location.href = "/shop/";
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = "block";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
