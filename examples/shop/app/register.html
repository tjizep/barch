<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Barch Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop/shop.css">
</head>
<body class="auth">
<div class="auth-card">
  <div class="logo"><b>Barch<em>.</em></b><small>Market</small></div>
  <h1>Create your account</h1>
  <p class="sub">A few details and the basket is yours.</p>
  <div class="err" id="err"></div>
  <form id="f">
    <div>
      <label for="name">Name</label>
      <input id="name" name="name" placeholder="Ada Lovelace">
    </div>
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="you@example.com">
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="6"
             placeholder="At least 6 characters">
    </div>
    <button type="submit">Create account</button>
  </form>
  <div class="foot">Already registered? <a href="/shop/signon.html">Sign in</a></div>
</div>
<script>
const f = document.getElementById("f");
const err = document.getElementById("err");
f.addEventListener("submit", async e => {
  e.preventDefault();
  err.style.display = "none";
  const btn = f.querySelector("button");
  btn.disabled = true;
  const body = { name: f.name.value, email: f.email.value, password: f.password.value };
  try {
    const r = await fetch("/api/register", { method: "POST", body: JSON.stringify(body) });
    const out = await r.json();
    if (!r.ok || out.error) throw new Error(out.error || "could not register");
    location.href = "/shop/";
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = "block";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
